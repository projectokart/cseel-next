<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><!-- Round White Background Disc (corners are 100% transparent) -->
  <circle cx="256" cy="256" r="256" fill="#FFFFFF" />

  <!-- Circular Ring Arcs (4 rounded quadrant arcs (corner radius 10, gap 60, margin to disc edge 12.3px)) -->
  <g transform="translate(256, 256)" fill="#023858" stroke="#023858" stroke-width="20" stroke-linejoin="round">
    <path id="q" d="M 40 -230.25 A 233.70 233.70 0 0 1 230.25 -40 L 207.89 -40 A 211.70 211.70 0 0 0 40 -207.89 Z" />
    <use href="#q" transform="scale(1,-1)" />
    <use href="#q" transform="scale(-1,1)" />
    <use href="#q" transform="scale(-1,-1)" />
  </g>

  <!-- Central Vibrant Orange Nucleus -->
  <circle cx="256" cy="256" r="48.96" fill="#F9A421" />

  <!-- Atomic Orbits (3 ellipses rotated at 30, 90, 150 deg) -->
  <g id="orbits" transform="translate(256, 256)" fill="none" stroke="#023858" stroke-width="11.52">
    <ellipse rx="171.6" ry="77" transform="rotate(30)" />
    <ellipse rx="171.6" ry="77" transform="rotate(90)" />
    <ellipse rx="171.6" ry="77" transform="rotate(150)" />
  </g>

  <!-- Electrons (3 dots at orbit vertices with white borders) -->
  <g id="electrons">
    <!-- Top electron -->
    <circle cx="256" cy="84.4" r="27.6" fill="#FFFFFF" />
    <circle cx="256" cy="84.4" r="21.6" fill="#023858" />

    <!-- Bottom-left electron -->
    <circle cx="107.4" cy="341.8" r="27.6" fill="#FFFFFF" />
    <circle cx="107.4" cy="341.8" r="21.6" fill="#023858" />

    <!-- Bottom-right electron -->
    <circle cx="404.6" cy="341.8" r="27.6" fill="#FFFFFF" />
    <circle cx="404.6" cy="341.8" r="21.6" fill="#023858" />
  </g>
</svg>