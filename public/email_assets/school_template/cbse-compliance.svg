<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side lines -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Satellite: Gold Star Circle -->
  <circle cx="388" cy="64" r="28" fill="#fef7e0" stroke="#fbbc04" stroke-width="2.4"/>
  <path d="M388 48 l4 10 l11 1 l-8 8 l2 11 l-9 -5 l-9 5 l2 -11 l-8 -8 l11 -1z" fill="#fbbc04"/>

  <!-- Center: CBSE Compliance Certificate Card -->
  <rect x="155" y="30" width="210" height="200" rx="16" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  
  <!-- Header with blue badge & line -->
  <rect x="175" y="44" width="170" height="30" rx="8" fill="#e8f0fe"/>
  <circle cx="195" cy="59" r="10" fill="#1a73e8"/>
  <path d="M191 59 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="214" y="54" width="112" height="10" rx="5" fill="#1a73e8"/>

  <!-- 3 Checkpoints inside certificate -->
  <g transform="translate(175, 88)">
    <circle cx="12" cy="12" r="10" fill="#e6f4ea"/>
    <path d="M8 12 l3 3 l6 -6" stroke="#137333" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <rect x="30" y="7" width="128" height="9" rx="4.5" fill="#202124"/>
  </g>
  <g transform="translate(175, 118)">
    <circle cx="12" cy="12" r="10" fill="#e6f4ea"/>
    <path d="M8 12 l3 3 l6 -6" stroke="#137333" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <rect x="30" y="7" width="110" height="9" rx="4.5" fill="#202124"/>
  </g>
  <g transform="translate(175, 148)">
    <circle cx="12" cy="12" r="10" fill="#e6f4ea"/>
    <path d="M8 12 l3 3 l6 -6" stroke="#137333" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <rect x="30" y="7" width="120" height="9" rx="4.5" fill="#202124"/>
  </g>

  <!-- Verified Stamp Seal Bottom Center -->
  <circle cx="260" cy="194" r="18" fill="#e6f4ea" stroke="#137333" stroke-width="2.6"/>
  <path d="M252 194 l5 5 l11 -11" fill="none" stroke="#137333" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Top Left Satellite: Blue Ribbon Certificate Circle -->
  <circle cx="132" cy="80" r="26" fill="#1a73e8"/>
  <circle cx="132" cy="76" r="10" fill="#ffffff"/>
  <path d="M128 84 l-4 12 l8 -3 l8 3 l-4 -12" fill="#ffffff"/>

  <!-- Bottom Left Satellite: Green Trust Shield Card -->
  <rect x="100" y="160" width="60" height="60" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <path d="M130 170 l16 6 v10 c0 11 -16 16 -16 16 s-16 -5 -16 -16 v-10z" fill="#34a853"/>
  <path d="M124 184 l4 4 l8 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Bottom Right Satellite: School House in Green Card -->
  <rect x="366" y="164" width="56" height="56" rx="12" fill="#e6f4ea" stroke="#202124" stroke-width="3"/>
  <path d="M380 186 l14 -10 l14 10z" fill="#34a853" stroke="#202124" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="384" y="186" width="20" height="18" fill="#fff" stroke="#202124" stroke-width="2.4"/>
  <rect x="390" y="193" width="8" height="11" fill="#1a73e8"/>
