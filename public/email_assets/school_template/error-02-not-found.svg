<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side lines -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Satellite: Light blue circle with Magnifying Glass -->
  <circle cx="394" cy="58" r="28" fill="#a8c7fa"/>
  <circle cx="391" cy="55" r="9" fill="none" stroke="#202124" stroke-width="3"/>
  <path d="M398 62 l9 9" stroke="#202124" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Browser Window -->
  <rect x="150" y="34" width="220" height="190" rx="16" fill="#fff" stroke="#202124" stroke-width="3"/>
  <path d="M150 70 H370" stroke="#202124" stroke-width="3"/>
  <circle cx="170" cy="52" r="4.5" fill="#ea4335"/>
  <circle cx="186" cy="52" r="4.5" fill="#fbbc04"/>
  <circle cx="202" cy="52" r="4.5" fill="#34a853"/>
  
  <!-- Search query pill in address bar with Google 'G' -->
  <rect x="220" y="44" width="134" height="16" rx="8" fill="#e8eaed"/>
  <circle cx="230" cy="52" r="4.5" fill="#4285f4"/>
  <rect x="240" y="50" width="60" height="4" rx="2" fill="#9aa0a6"/>

  <!-- Inside Browser: Dotted empty frame for missing site -->
  <rect x="174" y="88" width="172" height="116" rx="12" fill="#f8fafd" stroke="#bdc1c6" stroke-width="2.4" stroke-dasharray="8 6"/>

  <!-- Big Red Question Mark in Center -->
  <circle cx="260" cy="140" r="32" fill="#fce8e6"/>
  <circle cx="260" cy="140" r="22" fill="#fff" stroke="#202124" stroke-width="3"/>
  <path d="M255 132 a5 5 0 0 1 10 0 c0 3.5 -5 5 -5 8.5" fill="none" stroke="#ea4335" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="260" cy="146" r="1.8" fill="#ea4335"/>

  <!-- Top Left Satellite: Blue circle with Graduation Cap -->
