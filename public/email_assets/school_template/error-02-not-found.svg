  <path d="M116 98 L132 90 L148 98 L132 106Z" fill="#ffffff"/>
  <path d="M123 103 v7 q9 6 18 0 v-7" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M148 98 v10" stroke="#fbbc04" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Bottom Left Satellite: Red alert card with cross -->
  <rect x="104" y="166" width="60" height="60" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <circle cx="134" cy="196" r="16" fill="#fce8e6"/>
  <path d="M127 189 l14 14 M141 189 l-14 14" stroke="#c5221f" stroke-width="3.2" stroke-linecap="round"/>

