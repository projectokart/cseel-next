<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <defs>
    <clipPath id="social-screen"><rect x="198" y="11" width="124" height="238" rx="19"/></clipPath>
  </defs>
  <!-- side lines -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Satellite: Light blue circle with Globe icon -->
  <circle cx="378" cy="58" r="28" fill="#a8c7fa"/>
  <circle cx="378" cy="58" r="12" fill="none" stroke="#202124" stroke-width="2.8"/>
  <ellipse cx="378" cy="58" rx="5" ry="12" fill="none" stroke="#202124" stroke-width="2.4"/>
  <path d="M366 58 h24" stroke="#202124" stroke-width="2.4"/>

  <!-- Central Smartphone -->
  <rect x="195" y="8" width="130" height="244" rx="22" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <g clip-path="url(#social-screen)">
    <!-- Top notch -->
    <rect x="237" y="16" width="46" height="9" rx="4.5" fill="#202124"/>
    
    <!-- Profile bar: Facebook blue circle + name lines -->
    <circle cx="214" cy="46" r="9" fill="#1877f2"/>
    <path d="M215 42 h3 v3 h-3 v2 h3 v2 h-3 v6 h-3 v-6 h-2 v-2 h2 v-2 a2 2 0 0 1 3 -3" fill="#ffffff"/>
    <rect x="228" y="42" width="50" height="6" rx="3" fill="#202124"/>
    <rect x="228" y="51" width="32" height="4" rx="2" fill="#bdc1c6"/>

    <!-- Social Photo Post Card with PERFECT Heart -->
    <rect x="203" y="66" width="114" height="84" rx="10" fill="#fce8e6"/>
    <path d="M260 116 c-12 -14 -20 -20 -20 -27 a10 10 0 0 1 17 -6.5 l3 3 l3 -3 a10 10 0 0 1 17 6.5 c0 7 -8 13 -20 27 z" fill="#ea4335"/>

    <!-- Social engagement dots -->
    <circle cx="214" cy="160" r="4.5" fill="#ea4335"/>
    <circle cx="226" cy="160" r="4.5" fill="#1877f2"/>
    <rect x="236" y="158" width="40" height="5" rx="2.5" fill="#bdc1c6"/>

    <!-- Sponsored Competitor Ad Card inside Feed -->
    <rect x="203" y="174" width="114" height="60" rx="8" fill="#fef7e0" stroke="#fbbc04" stroke-width="2"/>
    <rect x="211" y="182" width="34" height="5" rx="2.5" fill="#b06000"/>
    <rect x="211" y="191" width="98" height="5" rx="2.5" fill="#bdc1c6"/>
    <rect x="211" y="202" width="70" height="14" rx="7" fill="#ea4335"/>
    <rect x="219" y="207" width="42" height="4" rx="2" fill="#ffffff"/>
  </g>

  <!-- Top Left Satellite: Blue Notification Bell circle -->
  <circle cx="150" cy="80" r="24" fill="#1a73e8"/>
  <path d="M142 84 h16 c0 0 -2 -2 -2 -7 v-4 a6 6 0 0 0 -12 0 v4 c0 5 -2 7 -2 7z" fill="#ffffff"/>
  <circle cx="150" cy="88" r="2" fill="#ffffff"/>

  <!-- Bottom Left Satellite: Clean Red '✕' No Official Domain Card -->
  <rect x="100" y="164" width="60" height="60" rx="14" fill="#fff" stroke="#202124" stroke-width="3"/>
  <circle cx="130" cy="194" r="16" fill="#fce8e6"/>
  <path d="M123 187 l14 14 M137 187 l-14 14" stroke="#c5221f" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Right Satellite: Verified Green Check Badge -->
  <rect x="366" y="174" width="56" height="56" rx="12" fill="#e6f4ea" stroke="#202124" stroke-width="3"/>
  <path d="M378 202 l8 8 l16 -16" fill="none" stroke="#34a853" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>