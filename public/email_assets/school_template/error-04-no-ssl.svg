<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side framing curves -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>

  <!-- Browser Window Frame -->
  <rect x="145" y="32" width="230" height="194" rx="16" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <path d="M145 74 h230" stroke="#202124" stroke-width="3"/>
  
  <!-- Red Warning Pill in Address Bar -->
  <circle cx="166" cy="53" r="4.5" fill="#ea4335"/>
  <circle cx="180" cy="53" r="4.5" fill="#fbbc04"/>
  <circle cx="194" cy="53" r="4.5" fill="#34a853"/>
  
  <rect x="210" y="44" width="150" height="20" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="1.8"/>
  <!-- Unlocked padlock symbol in address bar -->
  <path d="M222 52 v-3 a4 4 0 0 1 8 0" fill="none" stroke="#c5221f" stroke-width="2" stroke-linecap="round"/>
  <rect x="219" y="52" width="10" height="8" rx="2" fill="#c5221f"/>
  <text x="245" y="58" font-family="'Google Sans', Roboto, Arial" font-size="10" font-weight="700" fill="#c5221f">Not Secure | http://</text>

  <!-- Big Red Broken Padlock in Screen -->
  <circle cx="260" cy="136" r="38" fill="#fce8e6"/>
  
  <!-- Open Padlock Body -->
  <rect x="242" y="128" width="36" height="28" rx="6" fill="#ffffff" stroke="#ea4335" stroke-width="3.2"/>
  <circle cx="260" cy="140" r="3.5" fill="#ea4335"/>
  <path d="M260 143 v5" stroke="#ea4335" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Broken open shackle tilted -->
  <path d="M248 128 v-10 a12 12 0 0 1 24 0 v2" fill="none" stroke="#ea4335" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Warning Red Headline -->
  <rect x="200" y="184" width="120" height="8" rx="4" fill="#fce8e6"/>
  <rect x="220" y="198" width="80" height="7" rx="3.5" fill="#e8eaed"/>

  <!-- Left Floating Shield: Google Chrome Red Warning -->
  <rect x="80" y="88" width="94" height="66" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <path d="M127 104 l18 7 v12 c0 14 -18 20 -18 20 s-18 -6 -18 -20 v-12z" fill="#ea4335"/>
  <text x="127" y="129" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">!</text>
  <text x="127" y="146" font-family="'Google Sans', Arial" font-size="8" font-weight="700" fill="#202124" text-anchor="middle">SSL Missing</text>

  <!-- Right Floating Badge: Green SSL Padlock Upgrade Solution -->
  <rect x="346" y="140" width="96" height="64" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <circle cx="372" cy="168" r="14" fill="#e6f4ea"/>
  <!-- Locked green padlock -->
  <path d="M367 166 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#137333" stroke-width="2.2"/>
  <rect x="364" y="166" width="16" height="12" rx="3" fill="#137333"/>
  <text x="408" y="166" font-family="'Google Sans', Arial" font-size="11" font-weight="700" fill="#137333">HTTPS</text>
  <text x="408" y="178" font-family="'Google Sans', Arial" font-size="8" font-weight="500" fill="#5f6368">Free SSL</text>
</svg>