<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side lines -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Satellite: Light Blue Virtual 360 circle -->
  <circle cx="394" cy="58" r="28" fill="#a8c7fa"/>
  <ellipse cx="394" cy="58" rx="14" ry="7" fill="none" stroke="#202124" stroke-width="2.6"/>
  <circle cx="394" cy="58" r="3.5" fill="#202124"/>

  <!-- Left: Cramped 1-Page Static Site (Old) -->
  <g transform="translate(130, 44)">
    <rect x="0" y="0" width="90" height="170" rx="12" fill="#ffffff" stroke="#9aa0a6" stroke-width="2.6"/>
    <rect x="10" y="12" width="70" height="10" rx="4" fill="#dadce0"/>
    <rect x="10" y="28" width="70" height="24" rx="4" fill="#e8eaed"/>
    <rect x="10" y="58" width="70" height="6" rx="3" fill="#bdc1c6"/>
    <rect x="10" y="70" width="50" height="6" rx="3" fill="#bdc1c6"/>
    <rect x="10" y="82" width="64" height="6" rx="3" fill="#bdc1c6"/>
    
    <!-- Red bottom limit cut line -->
    <rect x="10" y="124" width="70" height="24" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.8"/>
    <path d="M38 136 l8 8 M46 136 l-8 8" stroke="#c5221f" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="52" y="134" width="20" height="4" rx="2" fill="#c5221f"/>
  </g>

  <!-- Big Transformation Arrow in Center -->
  <g transform="translate(236, 114)">
    <circle cx="24" cy="16" r="20" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.6"/>
    <path d="M15 16 h18 M27 11 l5 5 l-5 5" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Modern Multi-Page Layered Portal -->
  <g transform="translate(296, 34)">
    <!-- Back page 2: Yellow card -->
    <rect x="22" y="0" width="116" height="180" rx="12" fill="#fef7e0" stroke="#202124" stroke-width="2.4"/>
    <!-- Back page 1: Green card -->
    <rect x="11" y="8" width="116" height="180" rx="12" fill="#e6f4ea" stroke="#202124" stroke-width="2.6"/>
    <!-- Front page: White main card -->
    <rect x="0" y="16" width="118" height="180" rx="12" fill="#ffffff" stroke="#202124" stroke-width="3"/>
    
    <!-- 4 Google Colored Nav Tabs -->
    <rect x="8" y="28" width="20" height="6" rx="3" fill="#1a73e8"/>
    <rect x="32" y="28" width="20" height="6" rx="3" fill="#34a853"/>
    <rect x="56" y="28" width="20" height="6" rx="3" fill="#fbbc04"/>
    <rect x="80" y="28" width="20" height="6" rx="3" fill="#ea4335"/>

    <!-- Hero banner -->
    <rect x="8" y="42" width="102" height="48" rx="8" fill="#a8c7fa"/>
    <circle cx="59" cy="66" r="12" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
    <ellipse cx="59" cy="66" rx="7" ry="3.5" fill="none" stroke="#1a73e8" stroke-width="1.6"/>

    <!-- 2 Content Blocks -->
    <rect x="8" y="98" width="46" height="38" rx="6" fill="#f8fafd" stroke="#dadce0" stroke-width="1.6"/>
    <rect x="64" y="98" width="46" height="38" rx="6" fill="#f8fafd" stroke="#dadce0" stroke-width="1.6"/>
    
    <!-- Green Live Check Badge at bottom -->
    <rect x="8" y="146" width="102" height="26" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="1.6"/>
    <circle cx="22" cy="159" r="6" fill="#137333"/>
    <path d="M19 159 l2 2 l4 -4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="34" y="156" width="58" height="5" rx="2.5" fill="#137333"/>
  </g>

  <!-- Top Left Satellite: Red circle with document icon -->
  <circle cx="106" cy="80" r="22" fill="#ea4335"/>
  <rect x="98" y="71" width="16" height="18" rx="3" fill="#ffffff"/>
  <path d="M102 76 h8 M102 81 h6" stroke="#ea4335" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bottom Left Satellite: Stacked Books -->
  <rect x="86" y="174" width="36" height="12" rx="3" fill="#4285f4" stroke="#202124" stroke-width="2"/>
  <rect x="84" y="160" width="38" height="12" rx="3" fill="#ea4335" stroke="#202124" stroke-width="2"/>
  <rect x="86" y="146" width="34" height="12" rx="3" fill="#34a853" stroke="#202124" stroke-width="2"/>

  <!-- Bottom Right Satellite: Verified Green School Badge -->
  <rect x="370" y="174" width="56" height="56" rx="12" fill="#e6f4ea" stroke="#202124" stroke-width="3"/>
  <path d="M384 196 l14 -10 l14 10z" fill="#34a853" stroke="#202124" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="388" y="196" width="20" height="18" fill="#fff" stroke="#202124" stroke-width="2.4"/>
  <rect x="394" y="203" width="8" height="11" fill="#1a73e8"/>
</svg>