<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <defs>
    <clipPath id="wa-screen"><rect x="198" y="11" width="124" height="238" rx="19"/></clipPath>
  </defs>
  <!-- side lines -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Satellite: Green Rocket Circle -->
  <circle cx="388" cy="64" r="28" fill="#a8d5b5"/>
  <path d="M388 48 c4 0 10 6 10 16 l-4 4 l-3 -3 l-3 3 l3 3 l-4 4 c-10 0 -16 -6 -16 -10 c0 -8 9 -17 17 -17z" fill="#202124"/>
  <circle cx="391" cy="56" r="2.5" fill="#ffffff"/>

  <!-- Central Smartphone (WhatsApp 30-Min Rapid Updates) -->
  <rect x="195" y="8" width="130" height="244" rx="22" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <g clip-path="url(#wa-screen)">
    <!-- Top notch -->
    <rect x="237" y="16" width="46" height="9" rx="4.5" fill="#202124"/>
    
    <!-- WhatsApp Green Header Bar -->
    <rect x="203" y="32" width="114" height="30" rx="8" fill="#25d366"/>
    <circle cx="218" cy="47" r="8" fill="#ffffff"/>
    <path d="M216 43 q3 0 5 5 l-1.5 1.5 q-1.5 0 -3 -1.5 q-1.5 -1.5 -1.5 -3z" fill="#25d366"/>
    <rect x="232" y="43" width="60" height="8" rx="4" fill="#ffffff"/>

    <!-- Circular PDF Upload Chat Bubble -->
    <rect x="203" y="72" width="114" height="52" rx="8" fill="#e6f4ea" stroke="#81c995" stroke-width="1.8"/>
    <!-- Red PDF File Icon -->
    <rect x="211" y="80" width="22" height="28" rx="4" fill="#ea4335"/>
    <rect x="215" y="85" width="14" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="215" y="91" width="10" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="240" y="85" width="64" height="7" rx="3.5" fill="#1f1f1f"/>
    <rect x="240" y="96" width="48" height="6" rx="3" fill="#137333"/>

    <!-- Downward Publishing Arrow -->
    <path d="M260 134 v12 M255 140 l5 6 l5 -6" stroke="#25d366" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Live in 30 Mins Result Box -->
    <rect x="203" y="156" width="114" height="42" rx="10" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
    <circle cx="220" cy="177" r="8" fill="#137333"/>
    <path d="M217 177 l2 2 l4 -4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <rect x="234" y="170" width="68" height="6" rx="3" fill="#137333"/>
    <rect x="234" y="180" width="46" height="5" rx="2.5" fill="#5f6368"/>
  </g>

  <!-- Top Left Satellite: Yellow Lightning Speed Circle -->
  <circle cx="140" cy="76" r="26" fill="#fef7e0" stroke="#fbbc04" stroke-width="2.4"/>
  <path d="M142 58 l-8 15 h8 l-3 14 l11 -17 h-8z" fill="#fbbc04" stroke="#202124" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Bottom Left Satellite: Slow Agency Ticket Clock Card -->
  <rect x="100" y="154" width="64" height="74" rx="14" fill="#fff" stroke="#202124" stroke-width="3"/>
  <rect x="108" y="162" width="48" height="12" rx="4" fill="#fce8e6"/>
  <circle cx="132" cy="196" r="16" fill="#f8f9fa" stroke="#202124" stroke-width="2.2"/>
  <path d="M132 186 v10 l7 5" stroke="#ea4335" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Bottom Right Satellite: Verified Green Check Badge -->
  <rect x="366" y="174" width="56" height="56" rx="12" fill="#e6f4ea" stroke="#202124" stroke-width="3"/>
  <path d="M378 202 l8 8 l16 -16" fill="none" stroke="#34a853" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>