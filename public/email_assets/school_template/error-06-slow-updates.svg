<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side framing curves -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>

  <!-- Left: Slow Agency Ticket Queue (7 Days Delay) -->
  <g transform="translate(95, 42)">
    <rect x="0" y="0" width="140" height="180" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
    <rect x="12" y="14" width="116" height="26" rx="8" fill="#fce8e6"/>
    <text x="70" y="31" font-family="'Google Sans', Arial" font-size="11" font-weight="700" fill="#c5221f" text-anchor="middle">Agency Ticket #410</text>
    
    <!-- Clock with slow 7 days indicator -->
    <circle cx="70" cy="80" r="26" fill="#f8f9fa" stroke="#202124" stroke-width="2.6"/>
    <path d="M70 62 v18 l12 8" stroke="#ea4335" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Status: 7 Days Waiting -->
    <rect x="15" y="118" width="110" height="22" rx="6" fill="#fce8e6"/>
    <text x="70" y="133" font-family="'Google Sans', Arial" font-size="10" font-weight="700" fill="#c5221f" text-anchor="middle">&#10005; Delayed 7 Days</text>
    <rect x="25" y="148" width="90" height="8" rx="4" fill="#e8eaed"/>
  </g>

  <!-- Center Lightning Bolt (Instant Speed) -->
  <g transform="translate(242, 105)">
    <circle cx="20" cy="24" r="24" fill="#fef7e0" stroke="#fbbc04" stroke-width="3"/>
    <path d="M22 6 l-10 18 h10 l-4 16 l14 -20 h-10z" fill="#fbbc04" stroke="#202124" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Right: 30-Minute WhatsApp Instant Publishing -->
  <g transform="translate(285, 36)">
    <rect x="0" y="0" width="145" height="190" rx="16" fill="#ffffff" stroke="#202124" stroke-width="3"/>
    
    <!-- WhatsApp Green Header -->
    <rect x="10" y="12" width="125" height="34" rx="10" fill="#25d366"/>
    <circle cx="28" cy="29" r="10" fill="#ffffff"/>
    <!-- phone icon -->
    <path d="M25 24 q4 0 7 7 l-2 2 q-2 0 -4 -2 q-2 -2 -2 -4z" fill="#25d366"/>
    <text x="78" y="33" font-family="'Google Sans', Arial" font-size="12" font-weight="700" fill="#ffffff">WhatsApp</text>

    <!-- PDF Circular Message Bubble -->
    <rect x="12" y="58" width="120" height="50" rx="8" fill="#e6f4ea" stroke="#81c995" stroke-width="1.6"/>
    <rect x="20" y="66" width="22" height="26" rx="4" fill="#ea4335"/>
    <text x="31" y="82" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">PDF</text>
    <text x="48" y="76" font-family="'Google Sans', Arial" font-size="9" font-weight="700" fill="#1f1f1f">Exam_Date.pdf</text>
    <text x="48" y="88" font-family="'Google Sans', Arial" font-size="8" font-weight="500" fill="#137333">Upload to website</text>

    <!-- Arrow down to live site -->
    <path d="M72 112 v12 M66 120 l6 6 l6 -6" stroke="#25d366" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Green Result Pill: Live in 30 Mins -->
    <rect x="10" y="138" width="125" height="34" rx="10" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
    <text x="72" y="154" font-family="'Google Sans', Arial" font-size="11" font-weight="700" fill="#137333" text-anchor="middle">&check; Live in 30 Mins</text>
    <text x="72" y="166" font-family="'Google Sans', Arial" font-size="8" font-weight="500" fill="#5f6368" text-anchor="middle">Direct with Developer</text>
  </g>
</svg>