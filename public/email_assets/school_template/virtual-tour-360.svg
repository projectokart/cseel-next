<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side framing curves -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>

  <!-- Desktop Monitor Showing Campus 360 Tour -->
  <rect x="155" y="32" width="210" height="135" rx="12" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <!-- Monitor screen content -->
  <rect x="165" y="42" width="190" height="115" rx="6" fill="#e8f0fe"/>
  
  <!-- Campus panorama hill & school building -->
  <path d="M165 110 q50 -25 95 -5 q45 20 95 -10 v62 h-190z" fill="#a8d5b5"/>
  <!-- School building vector in background -->
  <rect x="235" y="75" width="50" height="35" rx="3" fill="#ffffff" stroke="#202124" stroke-width="2"/>
  <polygon points="230,75 260,55 290,75" fill="#ea4335" stroke="#202124" stroke-width="2"/>
  <rect x="253" y="93" width="14" height="17" fill="#1a73e8"/>
  <circle cx="260" cy="70" r="4" fill="#fbbc04"/>

  <!-- 360 Degree Panoramic Rotating Ring Overlay -->
  <ellipse cx="260" cy="115" rx="42" ry="14" fill="none" stroke="#1a73e8" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- Arrow heads on rotating ring -->
  <polygon points="302,113 306,120 298,118" fill="#1a73e8"/>
  <polygon points="218,117 214,110 222,112" fill="#1a73e8"/>
  <circle cx="260" cy="115" r="16" fill="#1a73e8"/>
  <text x="260" y="119" font-family="'Google Sans', Arial" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">360&deg;</text>

  <!-- Monitor stand -->
  <path d="M250 167 h20 v20 h-20z" fill="#bdc1c6" stroke="#202124" stroke-width="3"/>
  <rect x="230" y="187" width="60" height="8" rx="4" fill="#202124"/>

  <!-- Left Floating Badge: Virtual Reality / Mobile View -->
  <rect x="80" y="90" width="94" height="64" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <rect x="94" y="104" width="28" height="20" rx="5" fill="#a8c7fa" stroke="#202124" stroke-width="2"/>
  <circle cx="102" cy="114" r="3" fill="#fff"/>
  <circle cx="114" cy="114" r="3" fill="#fff"/>
  <rect x="94" y="132" width="66" height="6" rx="3" fill="#1a73e8"/>
  <text x="127" y="148" font-family="'Google Sans', Arial" font-size="8" font-weight="700" fill="#202124" text-anchor="middle">Virtual Tour</text>

  <!-- Right Floating Badge: Admissions Conversion Boost -->
  <rect x="348" y="130" width="96" height="65" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <circle cx="372" cy="154" r="13" fill="#e6f4ea"/>
  <path d="M366 158 l6 -8 l4 4 l6 -8" fill="none" stroke="#137333" stroke-width="2.6" stroke-linecap="round"/>
  <text x="408" y="152" font-family="'Google Sans', Arial" font-size="11" font-weight="700" fill="#137333">+40%</text>
  <text x="408" y="164" font-family="'Google Sans', Arial" font-size="8" font-weight="500" fill="#5f6368">Admissions</text>
</svg>