<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side lines -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Satellite: Light Blue 360 Globe Circle -->
  <circle cx="394" cy="58" r="28" fill="#a8c7fa"/>
  <circle cx="394" cy="58" r="12" fill="none" stroke="#202124" stroke-width="2.8"/>
  <ellipse cx="394" cy="58" rx="5" ry="12" fill="none" stroke="#202124" stroke-width="2.4"/>
  <path d="M382 58 h24" stroke="#202124" stroke-width="2.4"/>

  <!-- Central Desktop Monitor on Stand -->
  <rect x="150" y="28" width="220" height="145" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <!-- Screen landscape view -->
  <rect x="160" y="38" width="200" height="125" rx="8" fill="#e8f0fe"/>
  <path d="M160 115 q55 -28 100 -6 q50 22 100 -12 v66 h-200z" fill="#a8d5b5"/>
  <!-- School building inside monitor -->
  <rect x="235" y="74" width="50" height="38" rx="4" fill="#ffffff" stroke="#202124" stroke-width="2"/>
  <polygon points="230,74 260,54 290,74" fill="#ea4335" stroke="#202124" stroke-width="2"/>
  <rect x="253" y="93" width="14" height="19" fill="#1a73e8"/>
  <circle cx="260" cy="69" r="4" fill="#fbbc04"/>

  <!-- Dotted 360 rotating orbit -->
  <ellipse cx="260" cy="116" rx="50" ry="17" fill="none" stroke="#1a73e8" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="310,114 315,122 306,120" fill="#1a73e8"/>
  <polygon points="210,118 205,110 214,112" fill="#1a73e8"/>

  <!-- Pure Center 360 Sphere Badge -->
  <circle cx="260" cy="116" r="16" fill="#1a73e8"/>
  <text x="260" y="120" font-family="'Google Sans', Roboto, Arial" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">360&deg;</text>

  <!-- Monitor stand & base -->
  <path d="M250 173 h20 v20 h-20z" fill="#bdc1c6" stroke="#202124" stroke-width="3"/>
  <rect x="228" y="193" width="64" height="8" rx="4" fill="#202124"/>

  <!-- Top Left Satellite: Blue Camera Eye Circle -->
  <circle cx="132" cy="80" r="26" fill="#1a73e8"/>
  <circle cx="132" cy="80" r="12" fill="#ffffff"/>
  <circle cx="132" cy="80" r="6" fill="#1a73e8"/>

  <!-- Bottom Left Satellite: VR Headset Card -->
  <rect x="100" y="156" width="60" height="60" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <rect x="108" y="172" width="44" height="24" rx="8" fill="#a8c7fa" stroke="#202124" stroke-width="2.2"/>
  <circle cx="120" cy="184" r="4.5" fill="#ffffff"/>
  <circle cx="140" cy="184" r="4.5" fill="#ffffff"/>

  <!-- Bottom Right Satellite: Growth Arrow Card -->
  <rect x="366" y="164" width="60" height="60" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <circle cx="396" cy="194" r="16" fill="#e6f4ea"/>
  <path d="M386 200 l7 -8 l5 5 l9 -11" fill="none" stroke="#137333" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M402 186 h5 v5" fill="none" stroke="#137333" stroke-width="3" stroke-linecap="round"/>
</svg>