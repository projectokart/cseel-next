<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side lines -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Satellite: Mint Green Star of Excellence Circle -->
  <circle cx="390" cy="66" r="28" fill="#a8d5b5"/>
  <path d="M390 52 l4 9 l10 1 l-7 7 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -7 l10 -1z" fill="#202124"/>

  <!-- Central Shield of Trust -->
  <g transform="translate(195, 20)">
    <path d="M65 6 l58 22 v48 c0 48 -58 72 -58 72 s-58 -24 -58 -72 v-48z" fill="#ffffff" stroke="#202124" stroke-width="3"/>
    <path d="M65 18 l46 18 v40 c0 38 -46 58 -46 58 s-46 -20 -46 -58 v-40z" fill="#e6f4ea"/>
    
    <!-- Big Bold Green Checkmark -->
    <path d="M44 72 l15 15 l30 -32" fill="none" stroke="#137333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom Ribbon Pill: Work First Pay Later -->
    <rect x="-15" y="152" width="160" height="34" rx="17" fill="#1a73e8" stroke="#202124" stroke-width="2.6"/>
    <circle cx="10" cy="169" r="6" fill="#fbbc04"/>
    <rect x="26" y="165" width="104" height="8" rx="4" fill="#ffffff"/>
  </g>

  <!-- Top Left Satellite: Gold Coin Circle (₹0) -->
  <circle cx="140" cy="86" r="28" fill="#fef7e0" stroke="#fbbc04" stroke-width="2.4"/>
  <text x="140" y="96" font-family="'Google Sans', Arial" font-size="22" font-weight="700" fill="#b06000" text-anchor="middle">&#8377;0</text>

  <!-- Bottom Left Satellite: 3D Stack of Golden Coins -->
  <ellipse cx="128" cy="214" rx="34" ry="11" fill="#fbbc04" stroke="#202124" stroke-width="3"/>
  <path d="M94 214 v-14 a34 11 0 0 1 68 0 v14" fill="#fbbc04" stroke="#202124" stroke-width="3"/>
  <ellipse cx="128" cy="200" rx="34" ry="11" fill="#fdd663" stroke="#202124" stroke-width="3"/>
  <path d="M94 200 v-14 a34 11 0 0 1 68 0 v14" fill="#fdd663" stroke="#202124" stroke-width="3"/>
  <ellipse cx="128" cy="186" rx="34" ry="11" fill="#fde293" stroke="#202124" stroke-width="3"/>

  <!-- Bottom Right Satellite: Green Locked Padlock Card -->
  <rect x="366" y="164" width="60" height="60" rx="14" fill="#e6f4ea" stroke="#202124" stroke-width="3"/>
  <rect x="382" y="184" width="28" height="22" rx="5" fill="#34a853"/>
  <circle cx="396" cy="193" r="2.5" fill="#ffffff"/>
  <path d="M396 195 v3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Locked shackle -->
  <path d="M387 184 v-7 a9 9 0 0 1 18 0 v7" fill="none" stroke="#202124" stroke-width="2.8" stroke-linecap="round"/>
</svg>