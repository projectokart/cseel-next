<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <!-- side framing curves -->
  <path d="M70 120 q-14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 120 q14 18 0 40" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 110 q-22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M460 110 q22 28 0 60" fill="none" stroke="#bdc1c6" stroke-width="2" stroke-linecap="round"/>

  <!-- Golden / Green Shield of Guarantee in Center -->
  <g transform="translate(195, 25)">
    <!-- Big Shield -->
    <path d="M65 8 l55 20 v45 c0 45 -55 68 -55 68 s-55 -23 -55 -68 v-45z" fill="#ffffff" stroke="#202124" stroke-width="3"/>
    <path d="M65 18 l45 16 v38 c0 36 -45 56 -45 56 s-45 -20 -45 -56 v-38z" fill="#e6f4ea"/>
    
    <!-- Big Checkmark -->
    <path d="M45 68 l14 14 l28 -30" fill="none" stroke="#137333" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Banner: Work First, Pay Later -->
    <rect x="-10" y="148" width="150" height="34" rx="17" fill="#1a73e8" stroke="#202124" stroke-width="2.6"/>
    <text x="65" y="169" font-family="'Google Sans', Roboto, Arial" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">WORK FIRST &bull; PAY LATER</text>
  </g>

  <!-- Left Floating Badge: Zero Advance Needed (&#8377;0) -->
  <rect x="80" y="85" width="96" height="72" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <circle cx="128" cy="112" r="18" fill="#fef7e0" stroke="#fbbc04" stroke-width="2"/>
  <text x="128" y="118" font-family="'Google Sans', Arial" font-size="15" font-weight="700" fill="#b06000" text-anchor="middle">&#8377;0</text>
  <text x="128" y="146" font-family="'Google Sans', Arial" font-size="9" font-weight="700" fill="#1f1f1f" text-anchor="middle">Zero Advance</text>

  <!-- Right Floating Badge: 100% Satisfaction or No Payment -->
  <rect x="345" y="120" width="98" height="70" rx="14" fill="#ffffff" stroke="#202124" stroke-width="3"/>
  <circle cx="372" cy="146" r="13" fill="#e8f0fe"/>
  <!-- Handshake vector -->
  <path d="M364 146 l6 4 l6 -4 l4 4" fill="none" stroke="#1a73e8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="394" y="144" font-family="'Google Sans', Arial" font-size="11" font-weight="700" fill="#1a73e8">100%</text>
  <text x="394" y="156" font-family="'Google Sans', Arial" font-size="8" font-weight="500" fill="#5f6368">Risk-Free</text>
  <rect x="358" y="168" width="72" height="14" rx="7" fill="#e6f4ea"/>
  <text x="394" y="178" font-family="'Google Sans', Arial" font-size="8" font-weight="700" fill="#137333" text-anchor="middle">Pay after Live</text>
</svg>