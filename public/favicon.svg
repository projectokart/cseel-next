<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Round White Background Disc (corners are 100% transparent) -->
  <circle cx="256" cy="256" r="256" fill="#FFFFFF" />

  <defs>
    <!-- Cross mask to create the 4 separated circular quadrant arcs with rounded gaps -->
    <mask id="arc-gap-mask">
      <rect width="512" height="512" fill="#FFFFFF" />
      <!-- Vertical slit with rounded ends -->
      <rect x="244" y="32" width="24" height="448" rx="12" fill="#000000" />
      <!-- Horizontal slit with rounded ends -->
      <rect x="32" y="244" width="448" height="24" rx="12" fill="#000000" />
    </mask>
  </defs>

  <!-- Circular Ring Arcs (Enlarged 84% diameter: 430px, Safe margin inside 512px circle: 41px) -->
  <path d="M 256 41 A 215 215 0 1 1 255.9 41 Z M 256 94 A 162 162 0 1 0 256.1 94 Z" fill="#06556C" mask="url(#arc-gap-mask)" />

  <!-- Central Vibrant Orange Nucleus -->
  <circle cx="256" cy="256" r="34" fill="#F9A421" />

  <!-- Atomic Orbits (3 ellipses rotated at 30, 90, 150 deg) -->
  <g id="orbits" transform="translate(256, 256)" fill="none" stroke="#06556C" stroke-width="12">
    <ellipse rx="121" ry="54" transform="rotate(30)" />
    <ellipse rx="121" ry="54" transform="rotate(90)" />
    <ellipse rx="121" ry="54" transform="rotate(150)" />
  </g>

  <!-- Electrons (3 dots at orbit vertices with white borders) -->
  <g id="electrons">
    <!-- Top electron -->
    <circle cx="256" cy="135" r="14" fill="#FFFFFF" />
    <circle cx="256" cy="135" r="10.5" fill="#06556C" />

    <!-- Bottom-left electron -->
    <circle cx="151.2" cy="316.5" r="14" fill="#FFFFFF" />
    <circle cx="151.2" cy="316.5" r="10.5" fill="#06556C" />

    <!-- Bottom-right electron -->
    <circle cx="360.8" cy="316.5" r="14" fill="#FFFFFF" />
    <circle cx="360.8" cy="316.5" r="10.5" fill="#06556C" />
  </g>
</svg>