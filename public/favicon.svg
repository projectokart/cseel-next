<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Round White Background Disc (corners are 100% transparent) -->
  <circle cx="256" cy="256" r="256" fill="#FFFFFF" />

  <!-- Outer Quadrant Ring (0px ZERO outer white border: Outer edge reaches exact radius 256px) -->
  <g transform="translate(256, 256)" fill="none" stroke="#023858" stroke-width="26" stroke-linecap="round">
    <path id="q" d="M 238.6 -46 A 243 243 0 0 0 46 -238.6" />
    <use href="#q" transform="scale(1,-1)" />
    <use href="#q" transform="scale(-1,1)" />
    <use href="#q" transform="scale(-1,-1)" />
  </g>

  <!-- Central Vibrant Google Red Nucleus (#EA4335) -->
  <circle cx="256" cy="256" r="64" fill="#EA4335" />

  <!-- Atomic Orbits (EXPANDED TO rx=202, ry=92, 26px Bold Stroke, #023858) -->
  <g id="orbits" transform="translate(256, 256)" fill="none" stroke="#023858" stroke-width="26">
    <ellipse rx="202" ry="92" transform="rotate(90)" />
    <ellipse rx="202" ry="92" transform="rotate(30)" />
    <ellipse rx="202" ry="92" transform="rotate(150)" />
  </g>

  <!-- Electrons (3 dots at orbit vertices with white borders) -->
  <g id="electrons">
    <!-- Top electron -->
    <circle cx="256" cy="54" r="24" fill="#FFFFFF" />
    <circle cx="256" cy="54" r="18" fill="#023858" />

    <!-- Bottom-right electron -->
    <circle cx="431" cy="357" r="24" fill="#FFFFFF" />
    <circle cx="431" cy="357" r="18" fill="#023858" />

    <!-- Bottom-left electron -->
    <circle cx="81" cy="357" r="24" fill="#FFFFFF" />
    <circle cx="81" cy="357" r="18" fill="#023858" />
  </g>
</svg>
