<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Round White Background Disc (corners are 100% transparent) -->
  <circle cx="256" cy="256" r="256" fill="#FFFFFF" />

  <!-- Central Vibrant Google Yellow Nucleus -->
  <circle cx="256" cy="256" r="62" fill="#FBBC04" />

  <!-- Atomic Orbits (MAX SIZE - No Outer Ring, Bold 24px Stroke) -->
  <g id="orbits" transform="translate(256, 256)" fill="none" stroke-width="24">
    <!-- Orbit 1: Google Blue (Vertical 90 deg) -->
    <ellipse rx="212" ry="95" transform="rotate(90)" stroke="#1A73E8" />
    <!-- Orbit 2: Google Red (30 deg) -->
    <ellipse rx="212" ry="95" transform="rotate(30)" stroke="#EA4335" />
    <!-- Orbit 3: Google Green (150 deg) -->
    <ellipse rx="212" ry="95" transform="rotate(150)" stroke="#34A853" />
  </g>

  <!-- Electrons (3 large dots at orbit vertices matching Google orbit colors) -->
  <g id="electrons">
    <!-- Top electron (Google Blue on Orbit 1) -->
    <circle cx="256" cy="44" r="34" fill="#FFFFFF" />
    <circle cx="256" cy="44" r="26" fill="#1A73E8" />

    <!-- Bottom-right electron (Google Red on Orbit 2) -->
    <circle cx="439.6" cy="362" r="34" fill="#FFFFFF" />
    <circle cx="439.6" cy="362" r="26" fill="#EA4335" />

    <!-- Bottom-left electron (Google Green on Orbit 3) -->
    <circle cx="72.4" cy="362" r="34" fill="#FFFFFF" />
    <circle cx="72.4" cy="362" r="26" fill="#34A853" />
  </g>
</svg>
