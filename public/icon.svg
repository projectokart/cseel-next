<svg xmlns="http://www.w3.org/2000/svg" viewBox="148 148 552 552" width="552" height="552">
  <!-- Round Circular White Background Disc (Maximized 98.5% coverage) -->
  <circle cx="424" cy="424" r="276" fill="#FFFFFF" />

  <!-- Central Vibrant Orange Nucleus -->
  <circle cx="424" cy="424" r="76" fill="#F8A130" />

  <!-- 3 Atomic Orbits in Deep Navy Blue (#023858) -->
  <g id="orbits" transform="translate(424, 424)" fill="none" stroke="#023858" stroke-width="26">
    <ellipse rx="232" ry="106" transform="rotate(30)" />
    <ellipse rx="232" ry="106" transform="rotate(90)" />
    <ellipse rx="232" ry="106" transform="rotate(150)" />
  </g>

  <!-- 3 Electrons in DEEP NAVY BLUE (#023858) with White Protective Cutout Ring -->
  <g id="electrons">
    <!-- Top electron (90 deg orbit) -->
    <circle cx="424.0" cy="192.0" r="40" fill="#FFFFFF" />
    <circle cx="424.0" cy="192.0" r="30" fill="#023858" />

    <!-- Bottom-Left electron (150 deg orbit) -->
    <circle cx="223.1" cy="540.0" r="40" fill="#FFFFFF" />
    <circle cx="223.1" cy="540.0" r="30" fill="#023858" />

    <!-- Bottom-Right electron (30 deg orbit) -->
    <circle cx="624.9" cy="540.0" r="40" fill="#FFFFFF" />
    <circle cx="624.9" cy="540.0" r="30" fill="#023858" />
  </g>
</svg>