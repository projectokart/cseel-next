<svg xmlns="http://www.w3.org/2000/svg" viewBox="162 148.5 524 524" width="524" height="524">
  <!-- Solid White Background filling 100% of canvas -->
  <rect x="162" y="148.5" width="524" height="524" fill="#FFFFFF" />

  <!-- Central Nucleus (#F8A130) -->
  <circle cx="424" cy="424" r="76" fill="#F8A130" />

  <!-- Orbits in #023858 -->
  <g id="orbits" transform="translate(424, 424)" fill="none" stroke="#023858" stroke-width="26">
    <ellipse rx="232" ry="106" transform="rotate(30)" />
    <ellipse rx="232" ry="106" transform="rotate(90)" />
    <ellipse rx="232" ry="106" transform="rotate(150)" />
  </g>

  <!-- Electrons in Original Orange (#F8A130) with Protective White Rings -->
  <g id="electrons">
    <circle cx="424.0" cy="192.0" r="40" fill="#FFFFFF" />
    <circle cx="424.0" cy="192.0" r="30" fill="#F8A130" />
    <circle cx="223.1" cy="540.0" r="40" fill="#FFFFFF" />
    <circle cx="223.1" cy="540.0" r="30" fill="#F8A130" />
    <circle cx="624.9" cy="540.0" r="40" fill="#FFFFFF" />
    <circle cx="624.9" cy="540.0" r="30" fill="#F8A130" />
  </g>
</svg>