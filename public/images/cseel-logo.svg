<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 848" width="848" height="848">
  <!-- Pure White Bed in center opening and cross cuts -->
  <rect x="403" y="10" width="42" height="828" fill="#FFFFFF" />
  <rect x="10" y="403" width="828" height="42" fill="#FFFFFF" />
  <rect x="157" y="157" width="534" height="534" rx="165" fill="#FFFFFF" />

  <!-- 4 Symmetrical Deep Navy Brackets (#0A4B69) -->
  <!-- Top-Left -->
  <path d="M 403 10 L 236 10 A 226 226 0 0 0 10 236 L 10 403 L 157 403 L 157 322 A 165 165 0 0 1 322 157 L 403 157 Z" fill="#0A4B69" />

  <!-- Top-Right -->
  <path d="M 445 10 L 612 10 A 226 226 0 0 1 838 236 L 838 403 L 691 403 L 691 322 A 165 165 0 0 0 526 157 L 445 157 Z" fill="#0A4B69" />

  <!-- Bottom-Left -->
  <path d="M 10 445 L 10 612 A 226 226 0 0 0 236 838 L 403 838 L 403 691 L 322 691 A 165 165 0 0 1 157 526 L 157 445 Z" fill="#0A4B69" />

  <!-- Bottom-Right -->
  <path d="M 838 445 L 838 612 A 226 226 0 0 1 612 838 L 445 838 L 445 691 L 526 691 A 165 165 0 0 0 691 526 L 691 445 Z" fill="#0A4B69" />

  <!-- Central Solid Core Nucleus in Official CSEEL Golden Amber (#F8A130) -->
  <circle cx="424" cy="424" r="64" fill="#F8A130" />

  <!-- Central Science Atom: Expanded Orbits with Generous 20px Breathing Room Around Nucleus -->
  <g id="orbits" transform="translate(424, 424)">
    <!-- Right Orbit: 30 deg -->
    <ellipse cx="0" cy="0" rx="205" ry="92" transform="rotate(30)" fill="none" stroke="#0A4B69" stroke-width="16" />
    <!-- Center Orbit (Vertical): 90 deg -->
    <ellipse cx="0" cy="0" rx="205" ry="92" transform="rotate(90)" fill="none" stroke="#0A4B69" stroke-width="16" />
    <!-- Left Orbit: 150 deg -->
    <ellipse cx="0" cy="0" rx="205" ry="92" transform="rotate(150)" fill="none" stroke="#0A4B69" stroke-width="16" />
  </g>

  <!-- Exactly 1 Electron per Orbit (3 electrons total) in a balanced 120-deg tripod -->
  <g id="electrons">
    <!-- Electron 1 on Center Vertical Orbit (90 deg): Top (12 o'clock) -->
    <circle cx="424.0" cy="219.0" r="26" fill="#FFFFFF" />
    <circle cx="424.0" cy="219.0" r="20" fill="#0A4B69" />

    <!-- Electron 2 on Left Side Orbit (150 deg): Bottom-Left (8 o'clock) -->
    <circle cx="246.5" cy="526.5" r="26" fill="#FFFFFF" />
    <circle cx="246.5" cy="526.5" r="20" fill="#0A4B69" />

    <!-- Electron 3 on Right Side Orbit (30 deg): Bottom-Right (4 o'clock) -->
    <circle cx="601.5" cy="526.5" r="26" fill="#FFFFFF" />
    <circle cx="601.5" cy="526.5" r="20" fill="#0A4B69" />
  </g>
</svg>