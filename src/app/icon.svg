<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Round White Background Disc (corners are 100% transparent) -->
  <circle cx="256" cy="256" r="256" fill="#FFFFFF" />

  <!-- Circular Ring Arcs (4 rounded quadrant arcs (3X gap: 72px), outer white border = 1% [2.56px]) -->
  <g transform="translate(256, 256)" fill="#06556C" stroke="#06556C" stroke-width="20.8" stroke-linejoin="round">
    <path id="q" d="M 47.84 -238.29 A 243.04 243.04 0 0 1 238.29 -47.84 L 214.90 -47.84 A 220.16 220.16 0 0 0 47.84 -214.90 Z" />
    <use href="#q" transform="scale(1,-1)" />
    <use href="#q" transform="scale(-1,1)" />
    <use href="#q" transform="scale(-1,-1)" />
  </g>

  <!-- Central Vibrant Orange Nucleus -->
  <circle cx="256" cy="256" r="50.9" fill="#F9A421" />

  <!-- Atomic Orbits (3 Distinct High-Visibility Spectral Colors, Zero Diffraction, Bold 20px Stroke) -->
  <g id="orbits" transform="translate(256, 256)" fill="none" stroke-width="20">
    <!-- Orbit 1: Sapphire Blue (Vertical 90 deg) -->
    <ellipse rx="178.5" ry="80.1" transform="rotate(90)" stroke="#1E40AF" />
    <!-- Orbit 2: Crimson Red (30 deg) -->
    <ellipse rx="178.5" ry="80.1" transform="rotate(30)" stroke="#DC2626" />
    <!-- Orbit 3: Emerald Green (150 deg) -->
    <ellipse rx="178.5" ry="80.1" transform="rotate(150)" stroke="#059669" />
  </g>

  <!-- Electrons (3 dots at orbit vertices matching orbit colors) -->
  <g id="electrons">
    <!-- Top electron (Sapphire Blue on Orbit 1) -->
    <circle cx="256" cy="77.5" r="28.7" fill="#FFFFFF" />
    <circle cx="256" cy="77.5" r="22.5" fill="#1E40AF" />

    <!-- Bottom-right electron (Crimson Red on Orbit 2) -->
    <circle cx="410.5" cy="345.2" r="28.7" fill="#FFFFFF" />
    <circle cx="410.5" cy="345.2" r="22.5" fill="#DC2626" />

    <!-- Bottom-left electron (Emerald Green on Orbit 3) -->
    <circle cx="101.5" cy="345.2" r="28.7" fill="#FFFFFF" />
    <circle cx="101.5" cy="345.2" r="22.5" fill="#059669" />
  </g>
</svg>
