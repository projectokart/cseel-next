<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Round White Background Disc (corners are 100% transparent) -->
  <circle cx="256" cy="256" r="256" fill="#FFFFFF" />

  <!-- Central Vibrant Google Red Nucleus (#EA4335) -->
  <circle cx="256" cy="256" r="74" fill="#EA4335" />

  <!-- Atomic Orbits (Exact User Color: rgb(2, 56, 88) / #023858 - 26px Bold Stroke) -->
  <g id="orbits" transform="translate(256, 256)" fill="none" stroke="#023858" stroke-width="26">
    <ellipse rx="232" ry="106" transform="rotate(90)" />
    <ellipse rx="232" ry="106" transform="rotate(30)" />
    <ellipse rx="232" ry="106" transform="rotate(150)" />
  </g>

  <!-- Electrons (3 large dots at orbit vertices matching #023858) -->
  <g id="electrons">
    <!-- Top electron -->
    <circle cx="256" cy="24" r="26" fill="#FFFFFF" />
    <circle cx="256" cy="24" r="20" fill="#023858" />

    <!-- Bottom-right electron -->
    <circle cx="456.9" cy="372" r="26" fill="#FFFFFF" />
    <circle cx="456.9" cy="372" r="20" fill="#023858" />

    <!-- Bottom-left electron -->
    <circle cx="55.1" cy="372" r="26" fill="#FFFFFF" />
    <circle cx="55.1" cy="372" r="20" fill="#023858" />
  </g>
</svg>
