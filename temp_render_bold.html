<!DOCTYPE html><html><body style="margin:0;padding:0;overflow:hidden;background:transparent;width:1000px;height:1000px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Ultra-thin subtle white container with minimal padding so icon fills 95% of space -->
  <rect x="24" y="24" width="952" height="952" rx="270" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="12" />

  <!-- ── 4 Bold Deep Navy Corner Quadrants (Filling space, minimal outer gap) ── -->
  <!-- Top-Left: Deep Navy -->
  <path d="M 465 75 L 340 75 A 265 265 0 0 0 75 340 L 75 465 L 225 465 L 225 340 A 115 115 0 0 1 340 225 L 465 225 Z" fill="#003C6E" />

  <!-- Top-Right: Deep Navy -->
  <path d="M 535 75 L 660 75 A 265 265 0 0 1 925 340 L 925 465 L 775 465 L 775 340 A 115 115 0 0 0 660 225 L 535 225 Z" fill="#003C6E" />

  <!-- Bottom-Left: Deep Navy -->
  <path d="M 75 535 L 75 660 A 265 265 0 0 0 340 925 L 465 925 L 465 775 L 340 775 A 115 115 0 0 1 225 660 L 225 535 Z" fill="#003C6E" />

  <!-- Bottom-Right: Deep Navy -->
  <path d="M 925 535 L 925 660 A 265 265 0 0 1 660 925 L 535 925 L 535 775 L 660 775 A 115 115 0 0 0 775 660 L 775 535 Z" fill="#003C6E" />

  <!-- ── Central Science Atom: Bold Orbits & Prominent Golden Nucleus ── -->
  <g id="atom-group" transform="translate(500, 500)">
    <!-- Orbit 1 (Horizontal / -15 deg) - Thick 22px stroke for favicon visibility -->
    <ellipse cx="0" cy="0" rx="180" ry="82" transform="rotate(-15)" fill="none" stroke="#003C6E" stroke-width="22" stroke-linecap="round" />
    
    <!-- Orbit 2 (Tilted 48 deg) -->
    <ellipse cx="0" cy="0" rx="180" ry="82" transform="rotate(48)" fill="none" stroke="#003C6E" stroke-width="22" stroke-linecap="round" />

    <!-- Orbit 3 (Tilted 112 deg) -->
    <ellipse cx="0" cy="0" rx="180" ry="82" transform="rotate(112)" fill="none" stroke="#003C6E" stroke-width="22" stroke-linecap="round" />

    <!-- Electron Nodes (Bold 24px radius) -->
    <circle cx="-168" cy="-56" r="24" fill="#003C6E" />
    <circle cx="120" cy="-130" r="24" fill="#003C6E" />
    <circle cx="-18" cy="164" r="24" fill="#003C6E" />
    <circle cx="-16" cy="-164" r="24" fill="#003C6E" />

    <!-- Central Solid Core Nucleus: HUGE 80px radius (160px diameter) in CSEEL Golden Amber -->
    <circle cx="0" cy="0" r="82" fill="#F8A130" stroke="#FFFFFF" stroke-width="6" />
  </g>
</svg></body></html>
