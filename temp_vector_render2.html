<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:transparent;overflow:hidden;width:2048px;height:2048px;">
<div style="width:2048px;height:2048px;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="2048" height="2048">
  <defs>
    <!-- Inner rounded white bed behind the atom -->
    <!-- Inner square opening is from 226 to 774 with corner radius 74 -->
    <clipPath id="inner-bed-clip">
      <path d="M 482 226 L 300 226 A 74 74 0 0 0 226 300 L 226 700 A 74 74 0 0 0 300 774 L 700 774 A 74 74 0 0 0 774 700 L 774 300 A 74 74 0 0 0 700 226 Z" />
    </clipPath>
  </defs>

  <!-- ── 1. Pure White Bed Inside the Squircle (Behind the atom and in the cross gaps) ── -->
  <!-- Cross gaps: vertical (482 to 518) and horizontal (482 to 518) inside the brackets -->
  <rect x="480" y="76" width="40" height="848" fill="#FFFFFF" />
  <rect x="76" y="480" width="848" height="40" fill="#FFFFFF" />
  <!-- Inner squircle opening -->
  <path d="M 500 226 L 700 226 A 74 74 0 0 1 774 300 L 774 700 A 74 74 0 0 1 700 774 L 300 774 A 74 74 0 0 1 226 700 L 226 300 A 74 74 0 0 1 300 226 Z" fill="#FFFFFF" />

  <!-- ── 2. The 4 Symmetrical Deep Navy Brackets (Concentric Arcs, ZERO White Outer Halo) ── -->
  <!-- Top-Left Bracket -->
  <path d="M 482 76 L 300 76 A 224 224 0 0 0 76 300 L 76 482 L 226 482 L 226 300 A 74 74 0 0 1 300 226 L 482 226 Z" fill="#0A4B69" />

  <!-- Top-Right Bracket -->
  <path d="M 518 76 L 700 76 A 224 224 0 0 1 924 300 L 924 482 L 774 482 L 774 300 A 74 74 0 0 0 700 226 L 518 226 Z" fill="#0A4B69" />

  <!-- Bottom-Left Bracket -->
  <path d="M 76 518 L 76 700 A 224 224 0 0 0 300 924 L 482 924 L 482 774 L 300 774 A 74 74 0 0 1 226 700 L 226 518 Z" fill="#0A4B69" />

  <!-- Bottom-Right Bracket -->
  <path d="M 924 518 L 924 700 A 224 224 0 0 1 700 924 L 518 924 L 518 774 L 700 774 A 74 74 0 0 0 774 700 L 774 518 Z" fill="#0A4B69" />

  <!-- ── 3. Central Science Atom: Pure Geometric Curves ── -->
  <g id="atom-group" transform="translate(500, 500)">
    <!-- Orbit 1: Horizontal / -12 deg -->
    <ellipse cx="0" cy="0" rx="164" ry="72" transform="rotate(-12)" fill="none" stroke="#0A4B69" stroke-width="16" stroke-linecap="round" />
    
    <!-- Orbit 2: Tilted 48 deg -->
    <ellipse cx="0" cy="0" rx="164" ry="72" transform="rotate(48)" fill="none" stroke="#0A4B69" stroke-width="16" stroke-linecap="round" />

    <!-- Orbit 3: Tilted 108 deg -->
    <ellipse cx="0" cy="0" rx="164" ry="72" transform="rotate(108)" fill="none" stroke="#0A4B69" stroke-width="16" stroke-linecap="round" />

    <!-- Electron Nodes (Nodes on Orbits) -->
    <circle cx="-150" cy="-54" r="18" fill="#0A4B69" />
    <circle cx="110" cy="-118" r="18" fill="#0A4B69" />
    <circle cx="-16" cy="150" r="18" fill="#0A4B69" />
    <circle cx="-14" cy="-150" r="18" fill="#0A4B69" />

    <!-- Central Solid Core Nucleus in Official CSEEL Golden Amber (#F8A130) -->
    <circle cx="0" cy="0" r="58" fill="#F8A130" />
  </g>
</svg>
</div>

</html>
