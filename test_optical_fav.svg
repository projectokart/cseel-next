<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Crisp white background inside squircle -->
  <rect x="90" y="90" width="332" height="332" rx="90" fill="#FFFFFF" />

  <!-- 4 Deep Navy Brackets (#0A4B69) -->
  <!-- Top-Left -->
  <path d="M 236 16 L 140 16 A 124 124 0 0 0 16 140 L 16 236 L 100 236 L 100 180 A 80 80 0 0 1 180 100 L 236 100 Z" fill="#0A4B69" />

  <!-- Top-Right -->
  <path d="M 276 16 L 372 16 A 124 124 0 0 1 496 140 L 496 236 L 412 236 L 412 180 A 80 80 0 0 0 332 100 L 276 100 Z" fill="#0A4B69" />

  <!-- Bottom-Left -->
  <path d="M 16 276 L 16 372 A 124 124 0 0 0 140 496 L 236 496 L 236 412 L 180 412 A 80 80 0 0 1 100 332 L 100 276 Z" fill="#0A4B69" />

  <!-- Bottom-Right -->
  <path d="M 496 276 L 496 372 A 124 124 0 0 1 372 496 L 276 496 L 276 412 L 332 412 A 80 80 0 0 0 412 332 L 412 276 Z" fill="#0A4B69" />

  <!-- Center Atom -->
  <g transform="translate(256, 256)">
    <!-- Bold Orbits -->
    <ellipse cx="0" cy="0" rx="108" ry="48" transform="rotate(-15)" fill="none" stroke="#0A4B69" stroke-width="16" />
    <ellipse cx="0" cy="0" rx="108" ry="48" transform="rotate(45)" fill="none" stroke="#0A4B69" stroke-width="16" />
    <ellipse cx="0" cy="0" rx="108" ry="48" transform="rotate(105)" fill="none" stroke="#0A4B69" stroke-width="16" />

    <!-- Big Vivid Golden Nucleus with crisp white border so it pops -->
    <circle cx="0" cy="0" r="44" fill="#F8A130" stroke="#FFFFFF" stroke-width="6" />
  </g>
</svg>
