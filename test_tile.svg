  <path d="M 274 48 L 352 48 A 112 112 0 0 1 464 160 L 464 238 L 392 238 L 392 188 A 68 68 0 0 0 324 120 L 274 120 Z" fill="#0A4B69" />
  <path d="M 48 274 L 48 352 A 112 112 0 0 0 160 464 L 238 464 L 238 392 L 188 392 A 68 68 0 0 1 120 324 L 120 274 Z" fill="#0A4B69" />
  <path d="M 464 274 L 464 352 A 112 112 0 0 1 352 464 L 274 464 L 274 392 L 324 392 A 68 68 0 0 0 392 324 L 392 274 Z" fill="#0A4B69" />

  <!-- Center Atom -->
