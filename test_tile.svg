    <ellipse cx="0" cy="0" rx="105" ry="46" transform="rotate(-15)" fill="none" stroke="#0A4B69" stroke-width="16" />
    <ellipse cx="0" cy="0" rx="105" ry="46" transform="rotate(45)" fill="none" stroke="#0A4B69" stroke-width="16" />
