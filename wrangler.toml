name = "cseel-next"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[rules]]
type = "ESModule"
globs = ["**/*.js", "**/*.mjs"]

[alias]
"sharp" = "./.open-next/cloudflare-templates/shims/throw.js"
"@img/sharp-win32-x64" = "./.open-next/cloudflare-templates/shims/throw.js"
